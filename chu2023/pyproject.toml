[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chu-pair"
version = "0.1.0"
description = "Reference numerics for the Chu et al. stochastic-game pair approximation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.35",
    "numpy>=1.24",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
